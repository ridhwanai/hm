name: AZenith WebUI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
      - "webui/**"
      - "archdaemon/**"
      - "binprofiles/**"
      - "binutils/**"
      - "mainfiles/**"
      - "azenithApplist.json"
      - "version"
      - "version_type"

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    name: Build AZenith WebUI Flashable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      
      - name: Verify Module
        run: bash .github/scripts/verify.sh
        
      - name: Copy changelog file
        run: bash .github/scripts/changelog.sh

      - name: Determine Build Type
        id: build_type
        run: |
          V_TYPE=$(cat version_type | tr -d '\n\r ')
          echo "V_TYPE=$V_TYPE" >> $GITHUB_ENV
          echo "Build mode set to: $V_TYPE"
  
      - name: NDK Setup
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r29

      - name: Compile Daemon
        working-directory: ./archdaemon
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            ndk-build NDK_DEBUG=1
          else
            ndk-build
          fi

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile AZenith Profilesettings
        working-directory: ./binprofiles
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            cargo ndk -t arm64-v8a build
          else
            cargo ndk -t arm64-v8a build --release
          fi

      - name: Compile AZenith Utility
        working-directory: ./binutils
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            cargo ndk -t arm64-v8a build
          else
            cargo ndk -t arm64-v8a build --release
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build WebUI
        working-directory: ./webui
        run: |
          npm ci || npm install
          npm run build

      - name: Compile Flashable Zip
        id: compileZip
        run: bash .github/scripts/compile_zip.sh

      - name: Upload To Telegram
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: AZenith WebUI
        run: |
          if [ -n "$CHAT_ID" ] && [ -n "$BOT_TOKEN" ]; then
            export VERSION=$(git rev-list --count HEAD)
            bash .github/scripts/telebot.sh "${{ steps.compileZip.outputs.zipName }}"
          else
            echo "Telegram bot token or chatid is undefined!"
            echo 'Telegram secrets not set, skipping upload.'
          fi

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compileZip.outputs.artifactName }}
          path: ${{ steps.compileZip.outputs.zipName }}
          if-no-files-found: error
